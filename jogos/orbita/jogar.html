    <style>
      :root {
        --navy: #05060f;
        --cyan: #4df0ff;
        --magenta: #ff4de0;
        --gold: #ffcf4d;
        --ink: #eaf2ff;
        --dim: #8ea0c4;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body {
        margin: 0; padding: 0; height: 100%; width: 100%;
        background: var(--navy); color: var(--ink);
        font-family: "Geist", "Trebuchet MS", system-ui, -apple-system, sans-serif;
        overflow: hidden; touch-action: none; overscroll-behavior: none;
        user-select: none; -webkit-user-select: none;
      }
      #wrap { position: fixed; inset: 0; }
      canvas { display: block; width: 100%; height: 100%; touch-action: none; }
      .screen {
        position: absolute; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        padding: 24px; text-align: center;
        background: radial-gradient(ellipse at 50% 45%, rgba(10, 14, 40, 0.72), rgba(3, 4, 10, 0.94) 70%);
        backdrop-filter: blur(2px);

        margin: 0; font-size: clamp(44px, 16vw, 104px); letter-spacing: 0.16em;

      p { margin: 0; color: var(--dim); font-size: 15px; line-height: 1.55; max-width: 22em; }
      .big { font-size: clamp(48px, 18vw, 90px); font-weight: 700; color: var(--gold);
        text-shadow: 0 0 22px rgba(255, 207, 77, 0.55); line-height: 1; }
      .label { font-size: 12px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--dim); }
      .record { color: var(--gold); letter-spacing: 0.2em; font-size: 14px; font-weight: 600;
        text-shadow: 0 0 14px rgba(255, 207, 77, 0.7); animation: pulse 1.1s ease-in-out infinite; }
      @keyframes pulse { 50% { opacity: 0.45; } }
      .btn {
        appearance: none; border: 1px solid rgba(77, 240, 255, 0.55); background: rgba(77, 240, 255, 0.1);
        color: var(--ink); font: inherit; font-size: 16px; font-weight: 600; letter-spacing: 0.1em;
        padding: 0 26px; min-height: 52px; min-width: 200px; border-radius: 999px; cursor: pointer;
        text-transform: uppercase; box-shadow: 0 0 22px rgba(77, 240, 255, 0.22);
        transition: transform 0.14s ease, background 0.14s ease;
      }
      .btn:active { transform: scale(0.96); }
      .btn--ghost { border-color: rgba(255, 207, 77, 0.5); background: rgba(255, 207, 77, 0.08);
        box-shadow: 0 0 22px rgba(255, 207, 77, 0.16); font-size: 14px; }
      .btn--mini { min-width: 0; min-height: 44px; font-size: 12px; padding: 0 18px;
        border-color: rgba(142, 160, 196, 0.5); background: #0b1028; color: #eaf2ff; box-shadow: none; }
      .stats { display: flex; gap: 22px; color: var(--dim); font-size: 13px; letter-spacing: 0.08em; flex-wrap: wrap; justify-content: center; }
      .stats b { display: block; color: var(--ink); font-size: 20px; letter-spacing: 0; margin-top: 4px; }
      .copy { position: absolute; bottom: 14px; font-size: 12px; letter-spacing: 0.18em; color: #8ea0c4; }
      #hud {
        position: absolute; inset: 0; pointer-events: none;
        display: flex; justify-content: space-between; align-items: flex-start;
        padding: calc(14px + env(safe-area-inset-top)) 16px 0;
        font-variant-numeric: tabular-nums;
      }
      #hud[hidden] { display: none; }
      #hudLeft { text-align: left; }
      #score { font-size: 38px; font-weight: 700; line-height: 1; color: #fff; text-shadow: 0 0 16px rgba(77, 240, 255, 0.6); }
      #bestHud { font-size: 12px; letter-spacing: 0.2em; color: var(--dim); margin-top: 6px; }
      #combo { font-size: 15px; font-weight: 700; letter-spacing: 0.08em; color: var(--magenta);
        margin-top: 8px; min-height: 18px; text-shadow: 0 0 14px rgba(255, 77, 224, 0.7); }
      #pauseBtn { pointer-events: auto; }
      #banner {
        position: absolute; top: 34%; left: 0; right: 0; text-align: center; pointer-events: none;
        font-size: clamp(24px, 8vw, 40px); font-weight: 700; letter-spacing: 0.2em; color: var(--gold);
        text-shadow: 0 0 24px rgba(255, 207, 77, 0.7); opacity: 0;
      }
      #banner.show { animation: banner 1.5s ease forwards; }
      @keyframes banner { 0% { opacity: 0; transform: scale(0.7); } 18% { opacity: 1; transform: scale(1); } 75% { opacity: 1; } 100% { opacity: 0; transform: scale(1.1); } }
      @media (prefers-reduced-motion: reduce) { .record, #banner.show { animation: none; opacity: 1; } }

  <body>
    <div id="wrap">
      <canvas id="game"></canvas>

      <div id="hud" hidden>
        <div id="hudLeft">
          <div id="score">0</div>
          <div id="bestHud">RECORDE 0</div>
          <div id="combo"></div>
        </div>
        <button class="btn btn--mini" id="pauseBtn" type="button">PAUSAR</button>
      </div>
      <div id="banner"></div>

      <div class="screen" id="startScreen">
        <h1>ÓRBITA</h1>
        <p>Toque para trocar de órbita. Pegue estrelas. Desvie dos asteroides.</p>
        <div class="label">Recorde</div>
        <div class="big" id="bestStart">0</div>
        <button class="btn" id="playBtn" type="button">Jogar</button>
        <button class="btn btn--mini" id="soundBtn" type="button">SOM: LIGADO</button>
        <div class="copy">© 2026 Órbita</div>
      </div>

      <div class="screen" id="pauseScreen" hidden>
        <h2>PAUSADO</h2>
        <button class="btn" id="resumeBtn" type="button">Continuar</button>
        <button class="btn btn--mini" id="quitBtn" type="button">SAIR</button>
      </div>

      <div class="screen" id="overScreen" hidden>
        <h2>FIM DE JOGO</h2>
        <div class="label">Pontos</div>
        <div class="big" id="finalScore">0</div>
        <div class="record" id="newRecord" hidden>NOVO RECORDE!</div>
        <div class="label" id="bestOver">Recorde 0</div>
        <div class="stats">
          <div>Estrelas<b id="stStars">0</b></div>
          <div>Combo máx.<b id="stCombo">x1</b></div>
          <div>Quases<b id="stNear">0</b></div>
          <div>Nível<b id="stLevel">1</b></div>
        </div>
        <button class="btn btn--ghost" id="continueBtn" type="button">Continuar (assistir anúncio)</button>
        <button class="btn" id="againBtn" type="button">Jogar de novo</button>
        <div class="copy">© 2026 Órbita</div>
      </div>
    </div>

    <script>
      /* Shim de anúncios: funciona com ou sem a biblioteca real do AdSense. */
      window.adsbygoogle = window.adsbygoogle || [];
      var adBreak = (adConfig = function (o) { adsbygoogle.push(o); });
      function adsLibReady() { return !Array.isArray(window.adsbygoogle); }
      function showAd(opts) {
        // Sem a biblioteca real (adsbygoogle ainda é um Array), chamamos os callbacks direto.
        if (!adsLibReady()) {
          if (opts.beforeReward) opts.beforeReward(function () { if (opts.adViewed) opts.adViewed(); });
          else if (opts.afterAd) opts.afterAd();
          if (opts.adBreakDone) opts.adBreakDone({ breakStatus: "notReady" });
          return;
        }
        try { adBreak(opts); } catch (e) { if (opts.adBreakDone) opts.adBreakDone({ breakStatus: "error" }); }
      }
    </script>

    <script>
      (function () {
        "use strict";
        var canvas = document.getElementById("game");
        var ctx = canvas.getContext("2d");
        var W = 0, H = 0, CX = 0, CY = 0, DPR = 1;

        /* ---------- armazenamento ---------- */
        var memBest = 0;
        function loadBest() {
          try { return parseInt(localStorage.getItem("orbita.best") || "0", 10) || 0; }
          catch (e) { return memBest; }
        }
        function saveBest(v) {
          memBest = v;
          try { localStorage.setItem("orbita.best", String(v)); } catch (e) {}
        }
        var best = loadBest();
        var soundOn = true;
        try { soundOn = localStorage.getItem("orbita.sound") !== "off"; } catch (e) {}

        /* ---------- áudio ---------- */
        var actx = null;
        function audio() {
          if (!soundOn) return null;
          try {
            if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
            if (actx.state === "suspended") actx.resume();
            return actx;
          } catch (e) { return null; }
        }
        function beep(freq, dur, type, vol, slide) {
          var a = audio(); if (!a) return;
          var o = a.createOscillator(), g = a.createGain();
          o.type = type || "sine"; o.frequency.setValueAtTime(freq, a.currentTime);
          if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, slide), a.currentTime + dur);
          g.gain.setValueAtTime(0.0001, a.currentTime);
          g.gain.exponentialRampToValueAtTime(vol || 0.16, a.currentTime + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + dur);
          o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + dur + 0.02);
        }
        var S = {
          ding: function (c) { beep(760 + Math.min(c, 8) * 70, 0.16, "triangle", 0.18); },
          hop: function () { beep(300, 0.1, "square", 0.07, 520); },
          near: function () { beep(1200, 0.08, "sine", 0.1, 1500); },
          power: function () { beep(520, 0.3, "sine", 0.16, 1250); },
          boom: function () { beep(180, 0.5, "sawtooth", 0.22, 50); },
          level: function () { beep(600, 0.18, "triangle", 0.14, 900); }
        };

        /* ---------- redimensionamento ---------- */
        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2.5);
          W = window.innerWidth; H = window.innerHeight;
          canvas.width = Math.round(W * DPR); canvas.height = Math.round(H * DPR);
          canvas.style.width = W + "px"; canvas.style.height = H + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          CX = W / 2; CY = H / 2;
          var base = Math.min(W, H);
          G.rIn = base * 0.21; G.rOut = base * 0.33;
          G.planetR = base * 0.1;
          G.cometR = Math.max(7, base * 0.022);
          makeStars();
        }

        /* ---------- fundo estelar ---------- */
        var bgStars = [];
        function makeStars() {
          bgStars = [];
          var n = Math.round((W * H) / 9000);
          for (var i = 0; i < n; i++) {
            bgStars.push({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.3 + 0.3,
              p: Math.random() * Math.PI * 2, s: 0.6 + Math.random() * 1.8 });
          }
        }

        /* ---------- estado ---------- */
        var G = {
          state: "start", rIn: 100, rOut: 160, planetR: 50, cometR: 10,
          ang: -Math.PI / 2, speed: 1.5, ring: 0, hop: 1, hopFrom: 0,
          score: 0, combo: 0, mult: 1, maxCombo: 1, stars: 0, nears: 0,
          level: 1, nextLevel: 15, shield: 0, magnet: 0,
          items: [], parts: [], trail: [], confetti: [],
          shake: 0, t: 0, spawnT: 0, continued: false, dead: false, flash: 0
        };

        function reset() {
          G.ang = -Math.PI / 2; G.speed = 1.5; G.ring = 0; G.hop = 1;
          G.score = 0; G.combo = 0; G.mult = 1; G.maxCombo = 1; G.stars = 0; G.nears = 0;
          G.level = 1; G.nextLevel = 15; G.shield = 0; G.magnet = 0;
          G.items = []; G.parts = []; G.trail = []; G.confetti = [];
          G.shake = 0; G.t = 0; G.hopT = -9; G.spawnT = 0.7; G.continued = false; G.dead = false; G.flash = 0;
          updateHUD();
        }

        function radius(ring) { return ring === 0 ? G.rIn : G.rOut; }
        function playerR() {
          var from = radius(G.hopFrom), to = radius(G.ring);
          var e = G.hop >= 1 ? 1 : 1 - Math.pow(1 - G.hop, 3);
          return from + (to - from) * e;
        }

        /* ---------- entrada ---------- */
        function swap() {
          if (G.state !== "play") return;
          G.hopFrom = G.ring; G.ring = G.ring === 0 ? 1 : 0; G.hop = 0; G.hopT = G.t;
          S.hop();
          for (var i = 0; i < 8; i++) burst(CX + Math.cos(G.ang) * playerR(), CY + Math.sin(G.ang) * playerR(), "#4df0ff", 1);
        }
        canvas.addEventListener("pointerdown", function (e) { e.preventDefault(); swap(); }, { passive: false });
        window.addEventListener("keydown", function (e) {
          if (e.code === "Space" || e.code === "ArrowUp" || e.code === "ArrowDown" ||
              e.code === "ArrowLeft" || e.code === "ArrowRight" || e.code === "Enter") {
            e.preventDefault();
            if (G.state === "play") swap();
            else if (G.state === "start") startGame();
            else if (G.state === "over") restart();
            else if (G.state === "pause") resume();
          }
          if (e.code === "KeyP" && (G.state === "play" || G.state === "pause")) {
            e.preventDefault(); G.state === "play" ? pause() : resume();
          }
        });
        document.addEventListener("click", function (e) { var b = e.target.closest && e.target.closest("button"); if (b) b.blur(); });
        document.addEventListener("contextmenu", function (e) { e.preventDefault(); });
        window.addEventListener("resize", resize);
        document.addEventListener("visibilitychange", function () {
          if (document.hidden && G.state === "play") pause();
        });

        /* ---------- itens ---------- */
        function spawn() {
          var ring = Math.random() < 0.5 ? 0 : 1;
          var a = G.ang + Math.PI * (0.75 + Math.random() * 0.7);
          var r = Math.random();
          var type = "star";
          if (r < 0.015 && G.score > 8) type = "shield";
          else if (r < 0.03 && G.score > 8) type = "magnet";
          else if (r < 0.03 + Math.min(0.46, 0.22 + G.level * 0.035)) type = "rock";
          G.items.push({ ring: ring, a: a, type: type, alive: true, spin: Math.random() * 6, seed: Math.random() * 9 });
          if (Math.random() < Math.min(0.42, 0.08 + G.level * 0.05)) {
            G.items.push({ ring: 1 - ring, a: a + (Math.random() - 0.5) * 0.4,
              type: type === "rock" ? "star" : "rock", alive: true, spin: Math.random() * 6, seed: Math.random() * 9 });
          }
        }

        function burst(x, y, color, n, pow) {
          for (var i = 0; i < n; i++) {
            var a = Math.random() * Math.PI * 2, s = (pow || 1) * (30 + Math.random() * 110);
            G.parts.push({ x: x, y: y, vx: Math.cos(a) * s, vy: Math.sin(a) * s,
              life: 0.4 + Math.random() * 0.4, max: 0.8, c: color, r: 1 + Math.random() * 2.5 });
          }
        }

        function addConfetti() {
          var cols = ["#4df0ff", "#ff4de0", "#ffcf4d", "#ffffff"];
          for (var i = 0; i < 90; i++) {
            G.confetti.push({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
              vy: 90 + Math.random() * 180, vx: (Math.random() - 0.5) * 60,
              r: 3 + Math.random() * 4, rot: Math.random() * 6, vr: (Math.random() - 0.5) * 8,
              c: cols[(Math.random() * cols.length) | 0] });
          }
        }

        /* ---------- fluxo ---------- */
        var elStart = document.getElementById("startScreen"),
            elOver = document.getElementById("overScreen"),
            elPause = document.getElementById("pauseScreen"),
            elHud = document.getElementById("hud"),
            elBanner = document.getElementById("banner");

        function show(el, on) { el.hidden = !on; }

        function startGame() {
          audio();
          reset(); G.state = "play";
          show(elStart, false); show(elOver, false); show(elPause, false); show(elHud, true);
          try { adConfig({ preloadAdBreaks: "on", sound: soundOn ? "on" : "off" }); } catch (e) {}
        }

        function restart() {
          show(elOver, false);
          showAd({
            type: "next", name: "restart",
            beforeAd: function () {}, afterAd: function () { startGame(); },
            adBreakDone: function () { if (G.state !== "play") startGame(); }
          });
        }

        function pause() {
          if (G.state !== "play") return;
          G.state = "pause"; show(elPause, true);
        }
        function resume() {
          if (G.state !== "pause") return;
          G.state = "play"; show(elPause, false); last = performance.now(); G.shield = Math.max(G.shield, 1.5); updateHUD();
        }
        function quit() {
          G.state = "start"; show(elPause, false); show(elHud, false); show(elStart, true);
          document.getElementById("bestStart").textContent = best;
        }

        function die() {
          if (G.dead) return;
          G.dead = true; G.state = "over"; S.boom();
          G.shake = 18; G.flash = 1;
          var px = CX + Math.cos(G.ang) * playerR(), py = CY + Math.sin(G.ang) * playerR();
          burst(px, py, "#ff4de0", 36, 2.2); burst(px, py, "#ffcf4d", 20, 1.6);
          var rec = G.score > best;
          if (rec) { best = G.score; saveBest(best); }
          document.getElementById("finalScore").textContent = G.score;
          document.getElementById("bestOver").textContent = "Recorde " + best;
          show(document.getElementById("newRecord"), rec);
          if (rec) addConfetti();
          document.getElementById("stStars").textContent = G.stars;
          document.getElementById("stCombo").textContent = "x" + G.maxCombo;
          document.getElementById("stNear").textContent = G.nears;
          document.getElementById("stLevel").textContent = G.level;
          document.getElementById("continueBtn").hidden = G.continued;
          show(elHud, false);
          setTimeout(function () { if (G.state === "over") show(elOver, true); }, 650);
        }

        function doContinue() {
          if (G.continued) return;
          document.getElementById("continueBtn").disabled = true;
          showAd({
            type: "reward", name: "continuar",
            beforeReward: function (showAdFn) { showAdFn(); },
            adDismissed: function () { document.getElementById("continueBtn").disabled = false; },
            adViewed: function () { revive(); },
            adBreakDone: function () { document.getElementById("continueBtn").disabled = false; }
          });
        }

        function revive() {
          G.continued = true; G.dead = false; G.state = "play";
          G.items = []; G.combo = 0; G.mult = 1; G.shield = 3.5; G.flash = 0;
          show(elOver, false); show(elHud, true);
          document.getElementById("continueBtn").disabled = false;
          last = performance.now(); updateHUD(); S.power();
        }

        function banner(txt) {
          elBanner.textContent = txt; elBanner.classList.remove("show");
          void elBanner.offsetWidth; elBanner.classList.add("show");
        }

        function updateHUD() {
          document.getElementById("score").textContent = G.score;
          document.getElementById("bestHud").textContent = "RECORDE " + best;
          var c = document.getElementById("combo");
          var txt = G.mult > 1 ? "COMBO x" + G.mult : (G.combo > 1 ? "COMBO " + G.combo : "");
          if (G.shield > 0) txt += (txt ? "  ·  " : "") + "ESCUDO";
          if (G.magnet > 0) txt += (txt ? "  ·  " : "") + "ÍMÃ";
          c.textContent = txt;
        }

        document.getElementById("playBtn").addEventListener("click", startGame);
        document.getElementById("againBtn").addEventListener("click", restart);
        document.getElementById("continueBtn").addEventListener("click", doContinue);
        document.getElementById("pauseBtn").addEventListener("click", function () {
          if (G.state === "play") pause(); else if (G.state === "pause") resume();
        });
        document.getElementById("resumeBtn").addEventListener("click", resume);
        document.getElementById("quitBtn").addEventListener("click", quit);
        document.getElementById("soundBtn").addEventListener("click", function () {
          soundOn = !soundOn;
          this.textContent = "SOM: " + (soundOn ? "LIGADO" : "DESLIGADO");
          try { localStorage.setItem("orbita.sound", soundOn ? "on" : "off"); } catch (e) {}
          if (soundOn) S.ding(0);
        });
        document.getElementById("soundBtn").textContent = "SOM: " + (soundOn ? "LIGADO" : "DESLIGADO");
        document.getElementById("bestStart").textContent = best;

        /* ---------- atualização ---------- */
        function update(dt) {
          G.t += dt;
          for (var i = G.parts.length - 1; i >= 0; i--) {
            var p = G.parts[i];
            p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.96; p.vy *= 0.96; p.life -= dt;
            if (p.life <= 0) G.parts.splice(i, 1);
          }
          for (var ci = G.confetti.length - 1; ci >= 0; ci--) {
            var cf = G.confetti[ci];
            cf.y += cf.vy * dt; cf.x += cf.vx * dt; cf.rot += cf.vr * dt;
            if (cf.y > H + 30) G.confetti.splice(ci, 1);
          }
          if (G.shake > 0) G.shake = Math.max(0, G.shake - dt * 36);
          if (G.flash > 0) G.flash = Math.max(0, G.flash - dt * 2);
          if (G.state !== "play") return;

          if (G.hop < 1) G.hop = Math.min(1, G.hop + dt * 7);
          if (G.shield > 0) G.shield = Math.max(0, G.shield - dt);
          if (G.magnet > 0) G.magnet = Math.max(0, G.magnet - dt);

          G.speed = 1.5 + G.level * 0.14;
          G.ang += G.speed * dt;
          if (G.ang > Math.PI * 4) G.ang -= Math.PI * 4;

          var pr = playerR();
          G.trail.push({ a: G.ang, r: pr, life: 0.45 });
          for (var ti = G.trail.length - 1; ti >= 0; ti--) {
            G.trail[ti].life -= dt; if (G.trail[ti].life <= 0) G.trail.splice(ti, 1);
          }

          G.spawnT -= dt;
          if (G.spawnT <= 0) { spawn(); G.spawnT = Math.max(0.42, 1.25 - G.level * 0.07); }

          var px = CX + Math.cos(G.ang) * pr, py = CY + Math.sin(G.ang) * pr;
          var hitR = G.cometR + Math.min(W, H) * 0.028;

          for (var k = G.items.length - 1; k >= 0; k--) {
            var it = G.items[k];
            it.a -= (G.speed * 0.55 + 0.35) * dt;
            var ir = radius(it.ring);
            var ix = CX + Math.cos(it.a) * ir, iy = CY + Math.sin(it.a) * ir;
            var d = Math.hypot(ix - px, iy - py);

            if (it.type === "star" && G.magnet > 0 && d < Math.min(W, H) * 0.22) {
              it.ring = G.ring;
              it.a += (G.ang - it.a) * Math.min(1, dt * 4);
            }

            if (d < hitR) {
              if (it.type === "star") {
                G.items.splice(k, 1); G.stars++; G.combo++;
                G.mult = G.combo >= 20 ? 4 : G.combo >= 10 ? 3 : G.combo >= 5 ? 2 : 1;
                if (G.mult > G.maxCombo) G.maxCombo = G.mult;
                G.score += G.mult; S.ding(G.combo);
                burst(ix, iy, "#ffcf4d", 12, 1.2);
                if (G.score >= G.nextLevel) {
                  G.level++; G.nextLevel += 15; banner("NÍVEL " + G.level); S.level();
                }
                updateHUD(); continue;
              }
              if (it.type === "shield" || it.type === "magnet") {
                G.items.splice(k, 1); S.power();
                if (it.type === "shield") { G.shield = 7; banner("ESCUDO"); }
                else { G.magnet = 7; banner("ÍMÃ"); }
                burst(ix, iy, it.type === "shield" ? "#4df0ff" : "#ff4de0", 16, 1.4);
                updateHUD(); continue;
              }
              if (it.type === "rock") {
                if (G.shield > 0) {
                  G.shield = 0; G.items.splice(k, 1); G.shake = 10;
                  burst(ix, iy, "#4df0ff", 24, 1.8); S.boom(); updateHUD(); continue;
                }
                die(); return;
              }
            }

            if (it.type === "rock" && !it.nearDone && it.ring !== G.ring && G.t - G.hopT < 0.45 &&
                Math.abs(it.a - G.ang) < 0.35) {
              it.nearDone = true; G.nears++; G.score += 1; S.near();
              G.parts.push({ x: ix, y: iy, vx: 0, vy: -40, life: 0.8, max: 0.8, c: "#4df0ff", r: 2, txt: "QUASE!" });
              updateHUD();
            }

            if (it.a < G.ang - Math.PI * 1.2) {
              if (it.type === "star" && G.combo > 0) { G.combo = 0; G.mult = 1; updateHUD(); }
              G.items.splice(k, 1);
            }
          }
        }

        /* ---------- desenho ---------- */
        function drawStar(x, y, r, rot) {
          ctx.beginPath();
          for (var i = 0; i < 10; i++) {
            var rr = i % 2 ? r * 0.45 : r;
            var a = rot + (i * Math.PI) / 5 - Math.PI / 2;
            var fx = x + Math.cos(a) * rr, fy = y + Math.sin(a) * rr;
            i ? ctx.lineTo(fx, fy) : ctx.moveTo(fx, fy);
          }
          ctx.closePath();
        }

        function draw() {
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          var g = ctx.createLinearGradient(0, 0, 0, H);
          g.addColorStop(0, "#070a1c"); g.addColorStop(1, "#03040a");
          ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

          for (var i = 0; i < bgStars.length; i++) {
            var s = bgStars[i];
            var tw = 0.35 + 0.65 * Math.abs(Math.sin(G.t * s.s + s.p));
            ctx.globalAlpha = tw * 0.9;
            ctx.fillStyle = i % 9 === 0 ? "#4df0ff" : "#ffffff";
            ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
          }
          ctx.globalAlpha = 1;

          if (G.shake > 0) {
            ctx.translate((Math.random() - 0.5) * G.shake, (Math.random() - 0.5) * G.shake);
          }

          // anéis
          ctx.lineWidth = Math.max(1, Math.min(W, H) * 0.004);
          [0, 1].forEach(function (ring) {
            ctx.strokeStyle = G.ring === ring ? "rgba(77,240,255,0.55)" : "rgba(120,140,190,0.2)";
            ctx.shadowBlur = G.ring === ring ? 16 : 0; ctx.shadowColor = "#4df0ff";
            ctx.beginPath(); ctx.arc(CX, CY, radius(ring), 0, 6.2832); ctx.stroke();
          });
          ctx.shadowBlur = 0;

          // planeta
          var pr0 = G.planetR * (1 + Math.sin(G.t * 1.6) * 0.03);
          var pg = ctx.createRadialGradient(CX - pr0 * 0.3, CY - pr0 * 0.3, pr0 * 0.1, CX, CY, pr0);
          pg.addColorStop(0, "#ff9ef0"); pg.addColorStop(0.5, "#8d4dff"); pg.addColorStop(1, "#1b1356");
          ctx.shadowBlur = 50; ctx.shadowColor = "rgba(255,77,224,0.8)";
          ctx.fillStyle = pg; ctx.beginPath(); ctx.arc(CX, CY, pr0, 0, 6.2832); ctx.fill();
          ctx.shadowBlur = 0;

          // itens
          for (var k = 0; k < G.items.length; k++) {
            var it = G.items[k], ir = radius(it.ring);
            var ix = CX + Math.cos(it.a) * ir, iy = CY + Math.sin(it.a) * ir;
            var sz = Math.min(W, H) * 0.024;
            if (it.type === "star") {
              ctx.fillStyle = "#ffcf4d"; ctx.shadowBlur = 18; ctx.shadowColor = "#ffcf4d";
              drawStar(ix, iy, sz, G.t * 1.5 + it.seed); ctx.fill();
            } else if (it.type === "rock") {
              ctx.fillStyle = "#394063"; ctx.strokeStyle = "#ff4de0"; ctx.lineWidth = 1.6;
              ctx.shadowBlur = 14; ctx.shadowColor = "rgba(255,77,224,0.8)";
              ctx.beginPath();
              for (var v = 0; v < 7; v++) {
                var ang = (v / 7) * 6.2832 + it.spin + G.t * 0.6;
                var rr = sz * (0.95 + Math.sin(v * 2.3 + it.seed) * 0.26);
                var vx = ix + Math.cos(ang) * rr, vy = iy + Math.sin(ang) * rr;
                v ? ctx.lineTo(vx, vy) : ctx.moveTo(vx, vy);
              }
              ctx.closePath(); ctx.fill(); ctx.stroke();
            } else {
              var col = it.type === "shield" ? "#4df0ff" : "#ff4de0";
              ctx.strokeStyle = col; ctx.fillStyle = "rgba(255,255,255,0.1)";
              ctx.lineWidth = 2; ctx.shadowBlur = 20; ctx.shadowColor = col;
              ctx.beginPath(); ctx.arc(ix, iy, sz * 1.05, 0, 6.2832); ctx.fill(); ctx.stroke();
              ctx.fillStyle = col; ctx.font = "bold " + Math.round(sz) + "px sans-serif";
              ctx.textAlign = "center"; ctx.textBaseline = "middle";
              ctx.fillText(it.type === "shield" ? "S" : "M", ix, iy + 1);
            }
            ctx.shadowBlur = 0;
          }

          // rastro
          for (var t = 0; t < G.trail.length; t++) {
            var tr = G.trail[t], al = tr.life / 0.45;
            ctx.globalAlpha = al * 0.55;
            ctx.fillStyle = "#4df0ff";
            ctx.beginPath();
            ctx.arc(CX + Math.cos(tr.a) * tr.r, CY + Math.sin(tr.a) * tr.r, G.cometR * al * 0.8, 0, 6.2832);
            ctx.fill();
          }
          ctx.globalAlpha = 1;

          // cometa
          if (!G.dead) {
            var prr = playerR();
            var cx = CX + Math.cos(G.ang) * prr, cy = CY + Math.sin(G.ang) * prr;
            if (G.shield > 0) {
              ctx.strokeStyle = "rgba(77,240,255," + (0.4 + 0.3 * Math.sin(G.t * 10)) + ")";
              ctx.lineWidth = 2; ctx.beginPath();
              ctx.arc(cx, cy, G.cometR * 2.1, 0, 6.2832); ctx.stroke();
            }
            if (G.magnet > 0) {
              ctx.strokeStyle = "rgba(255,77,224,0.3)"; ctx.lineWidth = 1;
              ctx.beginPath(); ctx.arc(cx, cy, Math.min(W, H) * 0.22, 0, 6.2832); ctx.stroke();
            }
            ctx.shadowBlur = 28; ctx.shadowColor = "#4df0ff";
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(cx, cy, G.cometR, 0, 6.2832); ctx.fill();
            ctx.fillStyle = "#4df0ff"; ctx.globalAlpha = 0.6;
            ctx.beginPath(); ctx.arc(cx, cy, G.cometR * 1.5, 0, 6.2832); ctx.fill();
            ctx.globalAlpha = 1; ctx.shadowBlur = 0;
          }

          // partículas
          for (var pi = 0; pi < G.parts.length; pi++) {
            var p = G.parts[pi], a2 = Math.max(0, p.life / p.max);
            ctx.globalAlpha = a2;
            if (p.txt) {
              ctx.fillStyle = "#4df0ff"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
              ctx.font = "bold " + Math.round(Math.min(W, H) * 0.035) + "px sans-serif";
              ctx.fillText(p.txt, p.x, p.y);
            } else {
              ctx.fillStyle = p.c;
              ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.2832); ctx.fill();
            }
          }
          ctx.globalAlpha = 1;

          // confete
          for (var cj = 0; cj < G.confetti.length; cj++) {
            var c = G.confetti[cj];
            ctx.save(); ctx.translate(c.x, c.y); ctx.rotate(c.rot);
            ctx.fillStyle = c.c; ctx.fillRect(-c.r / 2, -c.r, c.r, c.r * 2);
            ctx.restore();
          }

          if (G.flash > 0) {
            ctx.fillStyle = "rgba(255,77,224," + G.flash * 0.35 + ")";
            ctx.fillRect(-40, -40, W + 80, H + 80);
          }
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
        }

        /* ---------- laço ---------- */
        var last = performance.now();
        function loop(now) {
          var dt = Math.min(0.05, (now - last) / 1000);
          last = now;
          update(dt); draw();
          requestAnimationFrame(loop);
        }
        resize();
        requestAnimationFrame(loop);
      })();
    </script>
  </body>
</html>
