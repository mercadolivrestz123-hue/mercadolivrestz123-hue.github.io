 var pf={x:p.x,y:p.y,w:P.PW,h:P.PH},pb={x:p.x+3,y:p.y+3,w:P.PW-6,h:P.PH-6},cx=p.x+P.PW/2,cy=p.y+P.PH/2;
 s.lv.gz.forEach(function(z,k){var o=ovl(pf,z);if(o&&!s.gIn[k]){p.g=-p.g;p.ground=false;p.coyote=0;p.buf=0;s.ev.push('flip')}s.gIn[k]=o});
 s.lv.rz.forEach(function(z,k){if(!s.rUsed[k]&&ovl(pf,z)){s.rUsed[k]=true;s.reverseT=2.5;s.ev.push('rev')}});
 s.hidden.forEach(function(h){if(!h.up&&Math.abs(cx-h.c*T-15)<70&&Math.abs(cy-h.r*T-15)<70){h.up=true;s.ev.push('pop')}});
 var d=s.door;
 if(s.door2&&!s.ran&&Math.abs(cx-d.x-15)<100&&Math.abs(cy-d.y-15)<90){s.doorFrom={x:d.x,y:d.y};s.door=d={x:s.door2.x,y:s.door2.y};s.ran=true;s.ev.push('run')}
 if(ovl(pb,{x:d.x+3,y:d.y,w:24,h:T})){s.won=true;s.ev.push('win');return}
 if(p.y>H+40||p.y<-40-P.PH){die(s);return}
 if(s.invuln>0)return;
 if(s.lv.spikes.some(function(o){return ovl(pb,o.box)})||s.hidden.some(function(h){return h.t>0.5&&ovl(pb,h.box)})||s.movers.some(function(m){return ovl(pb,{x:m.x+6,y:m.y+6,w:18,h:18})}))die(s)}
/*CORE_END*/
</script>
<script>
(function(){
var $=function(id){return document.getElementById(id)};
var cv=$('cv'),ctx=cv.getContext('2d'),stage=$('stage');
var store={get:function(k,d){try{var v=localStorage.getItem('fasetroll_'+k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:function(k,v){try{localStorage.setItem('fasetroll_'+k,JSON.stringify(v))}catch(e){}}};
var NL=LEVELS.length,unlocked=Math.max(1,Math.min(NL,store.get('unlocked',1)|0)),best=store.get('best',[]),run=store.get('run',[]),soundOn=store.get('sound',true)!==false;
if(!Array.isArray(best))best=[];if(!Array.isArray(run))run=[];
var mode='menu',paused=false,S=null,cur=0,deaths=0,dieT=0,winT=0,acc=0,last=0,parts=[],dAnim=1,adMuted=false;
var DEATH=['Caiu nessa?','Era óbvio...','De novo?','Clássico.','Confia não.','Tá rindo de quê?','Quase!','Nada é o que parece.','Essa doeu.','Hehehe.'];
var input={l:0,r:0,j:0},keys={},touch={l:0,r:0,j:0};
var COL={bg:'#1b1e3c',tile:'#f4a259',top:'#ffd08a',spike:'#ff5a6e',door:'#2ec4b6',doorIn:'#0d3b38',pl:'#7bdff2'};

/* ---------- som ---------- */
var AC=null;
function beep(f,d,type,v,f2,delay){if(!soundOn||adMuted)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
 var o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+(delay||0);o.type=type||'square';o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
 g.gain.setValueAtTime(v||0.06,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+0.03)}catch(e){}}
var SFX={jump:function(){beep(380,0.1,'square',0.04,720)},die:function(){beep(320,0.32,'sawtooth',0.07,55)},
 win:function(){beep(523,0.1,'square',0.05);beep(659,0.1,'square',0.05,0,0.1);beep(784,0.18,'square',0.05,0,0.2)},
 pop:function(){beep(950,0.06,'square',0.05,500)},run:function(){beep(220,0.28,'triangle',0.08,1100)},flip:function(){beep(640,0.22,'sine',0.08,180)},
 rev:function(){beep(260,0.12,'square',0.05,520);beep(520,0.12,'square',0.05,260,0.12)},rumble:function(){beep(90,0.15,'sawtooth',0.06,60)},
 thud:function(){beep(70,0.22,'triangle',0.12,35)},crack:function(){beep(160,0.12,'triangle',0.06,70)}};

/* ---------- layout ---------- */
function resize(){var vw=window.innerWidth,vh=window.innerHeight,sc=Math.min(vw/W,vh/H),w=Math.max(1,Math.floor(W*sc)),h=Math.max(1,Math.floor(H*sc));
 stage.style.width=w+'px';stage.style.height=h+'px';var dpr=Math.min(window.devicePixelRatio||1,3);cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr);
 ctx.setTransform(cv.width/W,0,0,cv.height/H,0,0)}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',function(){setTimeout(resize,150)});resize();
var isTouch=('ontouchstart' in window)||navigator.maxTouchPoints>0||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);

/* ---------- overlays ---------- */
var OVS=['ovStart','ovLevels','ovPause','ovDone','ovEnd'];
function show(id){OVS.forEach(function(o){$(o).classList.toggle('show',o===id)});var playing=!id;
 $('touch').classList.toggle('show',playing&&isTouch);$('pauseBtn').style.display=S&&(playing||id==='ovPause')?'block':'none'}
function toast(html,ms){var t=$('toast');t.innerHTML=html;t.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(function(){t.classList.remove('show')},ms||900)}
function totalRun(){var t=0;run.forEach(function(v,i){if(v!=null&&i!==cur)t+=v});return t}
function hud(){$('hud').innerHTML='Fase '+(cur+1)+'/'+NL+' · '+LEVELS[cur].name+'<br>💀 '+deaths+' · Total '+(totalRun()+deaths)}
function sndLabel(){$('bSound').textContent='SOM: '+(soundOn?'LIGADO':'DESLIGADO')}
function buildGrid(){var g=$('lvGrid');g.innerHTML='';for(var i=0;i<NL;i++){var b=document.createElement('button');b.className='lv';
 var ok=i<unlocked;b.disabled=!ok;b.innerHTML=ok?(i+1)+'<small>'+(best[i]!=null?'💀 '+best[i]:'nova')+'</small>':'🔒<small>'+(i+1)+'</small>';
 b.setAttribute('aria-label','Fase '+(i+1)+(ok?'':' bloqueada'));if(ok)b.onclick=(function(n){return function(){startLevel(n)}})(i);g.appendChild(b)}}

function startLevel(i){cur=i;deaths=0;S=buildLevel(i);mode='play';paused=false;acc=0;parts=[];dAnim=1;clearKeys();show(null);hud();
 toast('Fase '+(i+1)+' — '+LEVELS[i].name+'<small>'+LEVELS[i].hint+'</small>',1700)}
function respawn(){S=buildLevel(cur);mode='play';acc=0;dAnim=1}
function pause(){if(!S||paused||(mode!=='play'&&mode!=='dying'))return;paused=true;clearKeys();show('ovPause')}
function resume(){if(!paused)return;paused=false;if(S)S.invuln=0.5;acc=0;show(null)}
function toMenu(){paused=false;mode='menu';show('ovStart')}
function completed(){var n=cur;best[n]=best[n]==null?deaths:Math.min(best[n],deaths);run[n]=deaths;
 unlocked=Math.max(unlocked,Math.min(NL,n+2));store.set('best',best);store.set('run',run);store.set('unlocked',unlocked);mode='menu';
 if(n===NL-1){var tot=0;run.forEach(function(v){if(v!=null)tot+=v});$('endTxt').innerHTML='Você passou pelas '+NL+' fases com <b>'+tot+' mortes</b> 💀<br>Agora desafie alguém a fazer menos.';
  $('copied').textContent='';endTotal=tot;show('ovEnd')}
 else{$('doneTitle').textContent='FASE '+(n+1)+' CONCLUÍDA!';$('doneTxt').innerHTML='Mortes nesta fase: <b>'+deaths+'</b><br>Seu recorde: <b>'+best[n]+'</b>';show('ovDone')}}
var endTotal=0;
function nextLevel(){var n=cur+1;
 if(n%3===0){var done=false,go=function(){if(done)return;done=true;adMuted=false;startLevel(n)};
  try{adBreak({type:'next',name:'fase-'+n,beforeAd:function(){adMuted=true},afterAd:function(){adMuted=false},adBreakDone:go})}catch(e){}
  if(Array.isArray(window.adsbygoogle)||!(window.adsbygoogle&&window.adsbygoogle.loaded))go();else setTimeout(go,15000)}
 else startLevel(n)}

function share(){var txt='Zerei o Fase Troll com '+endTotal+' mortes 💀 Consegue menos? https://mercadolivrestz123-hue.github.io/jogos/fase-troll/';
 function copy(){var ok=function(){$('copied').textContent='Copiado! Agora é só colar.'};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fallback);else fallback();
  function fallback(){try{var ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);ok()}catch(e){$('copied').textContent=txt}}}
 if(navigator.share){navigator.share({text:txt}).catch(function(e){if(!e||e.name!=='AbortError')copy()})}else copy()}

$('bPlay').onclick=function(){var i=0;while(i<NL&&run[i]!=null)i++;if(i>=NL){run=[];store.set('run',run);i=0}startLevel(Math.min(i,unlocked-1))};
$('bLevels').onclick=function(){buildGrid();show('ovLevels')};
$('bBack').onclick=function(){show('ovStart')};
$('bSound').onclick=function(){soundOn=!soundOn;store.set('sound',soundOn);sndLabel();beep(600,0.1,'sine',0.08);try{adConfig({sound:soundOn?'on':'off'})}catch(e){}};
$('bResume').onclick=resume;$('bRestart').onclick=function(){paused=false;respawn();if(S)S.invuln=0.5;show(null)};
$('bMenu1').onclick=$('bMenu2').onclick=$('bMenu3').onclick=toMenu;
$('bNext').onclick=nextLevel;$('bShare').onclick=share;
$('bAgain').onclick=function(){run=[];store.set('run',run);startLevel(0)};
$('pauseBtn').onclick=function(){paused?resume():pause()};
document.addEventListener('click',function(e){var b=e.target&&e.target.closest&&e.target.closest('button');if(b)setTimeout(function(){b.blur()},0)},true);
sndLabel();try{adConfig({preloadAdBreaks:'on',sound:soundOn?'on':'off'})}catch(e){}

/* ---------- entrada ---------- */
function sync(){input.l=keys.ArrowLeft||keys.KeyA||touch.l?1:0;input.r=keys.ArrowRight||keys.KeyD||touch.r?1:0;input.j=keys.Space||keys.KeyW||keys.ArrowUp||touch.j?1:0}
function clearKeys(){keys={};touch.l=touch.r=touch.j=0;['bL','bR','bJ'].forEach(function(i){$(i).classList.remove('on')});sync()}
var GK={ArrowLeft:1,ArrowRight:1,ArrowUp:1,ArrowDown:1,Space:1,KeyA:1,KeyD:1,KeyW:1};
window.addEventListener('keydown',function(e){var k=e.code||e.key;
 if(k==='Escape'||k==='KeyP'){if(paused)resume();else pause();e.preventDefault();return}
 if(GK[k]){var ae=document.activeElement,btn=ae&&ae.tagName==='BUTTON';if(!document.querySelector('.ov.show')){e.preventDefault();if(btn)ae.blur()}else if(!(btn&&k==='Space'))e.preventDefault();keys[k]=1;sync()}},{passive:false});
window.addEventListener('keyup',function(e){var k=e.code||e.key;if(GK[k]){keys[k]=0;sync()}});
window.addEventListener('blur',clearKeys);
document.addEventListener('visibilitychange',function(){if(document.hidden)pause()});
function bindT(id,key){var el=$(id),ids={},n=0;
 el.addEventListener('pointerdown',function(e){e.preventDefault();if(!ids[e.pointerId]){ids[e.pointerId]=1;n++}try{el.setPointerCapture(e.pointerId)}catch(_){}touch[key]=1;el.classList.add('on');sync()});
 var up=function(e){if(ids[e.pointerId]){delete ids[e.pointerId];n--}if(n<=0){n=0;touch[key]=0;el.classList.remove('on');sync()}};
 ['pointerup','pointercancel','lostpointercapture'].forEach(function(t){el.addEventListener(t,up)});
 el.addEventListener('contextmenu',function(e){e.preventDefault()})}
bindT('bL','l');bindT('bR','r');bindT('bJ','j');
['game','touch'].forEach(function(id){$(id).addEventListener('touchmove',function(e){e.preventDefault()},{passive:false});$(id).addEventListener('contextmenu',function(e){e.preventDefault()})});
window.addEventListener('touchstart',function(){if(!isTouch){isTouch=true;if(mode==='play'&&!paused)show(null)}},{passive:true});

/* ---------- eventos do jogo ---------- */
function handle(){var ev=S.ev;for(var i=0;i<ev.length;i++){var e=ev[i];if(SFX[e])SFX[e]();
 if(e==='die'){deaths++;mode='dying';dieT=0.32;burst(S.p.x+11,S.p.y+11,COL.pl,22);toast(DEATH[Math.floor(Math.random()*DEATH.length)],800);hud()}
 else if(e==='win'){mode='winning';winT=0.35;burst(S.door.x+15,S.door.y+10,'#ffd08a',18)}
 else if(e==='run'){dAnim=0;toast('Tchauzinho! 👋',800)}
 else if(e==='flip')toast('Gravidade? Que gravidade?',900)}ev.length=0}
function burst(x,y,c,n){for(var i=0;i<n;i++){var a=Math.random()*Math.PI*2,v=80+Math.random()*220;parts.push({x:x,y:y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-80,l:0.5+Math.random()*0.3,c:c})}}

/* ---------- desenho ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
function tile(x,y,w,h,top){ctx.fillStyle=COL.tile;ctx.fillRect(x,y,w,h);if(top){ctx.fillStyle=COL.top;ctx.fillRect(x,y,w,4)}}
var ROT={u:0,r:Math.PI/2,d:Math.PI,l:-Math.PI/2};
function spike(c,r,o,sc){ctx.save();ctx.translate(c*T+15,r*T+15);ctx.rotate(ROT[o]);ctx.fillStyle=COL.spike;ctx.beginPath();
 var tip=15-22*sc;ctx.moveTo(-15,15);ctx.lineTo(-7.5,tip);ctx.lineTo(0,15);ctx.lineTo(7.5,tip);ctx.lineTo(15,15);ctx.closePath();ctx.fill();ctx.restore()}
function draw(now){var t=now/1000;ctx.fillStyle=COL.bg;ctx.fillRect(0,0,W,H);ctx.fillStyle='rgba(255,255,255,.05)';
 for(var y=15;y<H;y+=60)for(var x=15;x<W;x+=60)ctx.fillRect(x,y,3,3);
 if(!S)return;var lv=S.lv,r,c;
 lv.gz.forEach(function(z){ctx.fillStyle='rgba(180,130,255,'+(0.11+0.05*Math.sin(t*4))+')';ctx.fillRect(z.x,z.y,z.w,z.h);
  ctx.strokeStyle='rgba(210,180,255,.35)';ctx.lineWidth=2;for(var yy=z.y+20;yy<z.y+z.h-10;yy+=60){var cx=z.x+z.w/2,o=(t*20)%20;ctx.beginPath();ctx.moveTo(cx-6,yy+6-o/4);ctx.lineTo(cx,yy-o/4);ctx.lineTo(cx+6,yy+6-o/4);ctx.stroke()}});
 for(r=0;r<ROWS;r++)for(c=0;c<COLS;c++)if(lv.tile[r][c])tile(c*T,r*T,T,T,lv.top[r][c]);
 S.falls.forEach(function(f){if(f.y<H+30)tile(f.x+(f.st===1?Math.random()*4-2:0),f.y,T,T,f.st===0?lv.top[f.y/T][f.x/T]:true)});
 S.crushers.forEach(function(k){tile(k.x,k.y,k.w,k.h,false);if(k.st===1||k.st===2){ctx.fillStyle='rgba(0,0,0,.18)';ctx.fillRect(k.x,k.y+k.h-6,k.w,6)}});
 lv.spikes.forEach(function(o){spike(o.c,o.r,o.o,1)});
 S.hidden.forEach(function(h){if(h.up)spike(h.c,h.r,h.o,h.t)});
 S.movers.forEach(function(m){ctx.save();ctx.translate(m.x+15,m.y+15);ctx.rotate(m.a*7);ctx.fillStyle=COL.spike;ctx.beginPath();
  for(var i=0;i<16;i++){var a=i*Math.PI/8,rad=i%2?9:15;ctx.lineTo(Math.cos(a)*rad,Math.sin(a)*rad)}ctx.closePath();ctx.fill();ctx.fillStyle='#7a1d2b';ctx.beginPath();ctx.arc(0,0,4,0,7);ctx.fill();ctx.restore()});
 // porta
 var d=S.door,dx=d.x,dy=d.y;if(S.doorFrom&&dAnim<1){var e=dAnim*dAnim*(3-2*dAnim);dx=S.doorFrom.x+(d.x-S.doorFrom.x)*e;dy=S.doorFrom.y+(d.y-S.doorFrom.y)*e-Math.sin(dAnim*Math.PI)*60}
 var hang=!lv.solid[Math.min(ROWS-1,(d.y/T|0)+1)][d.x/T|0]&&(d.y/T|0)>0&&lv.solid[(d.y/T|0)-1][d.x/T|0];
 var by=hang?dy:dy-14;ctx.fillStyle=COL.door;rr(dx+2,by,26,44,5);ctx.fill();ctx.fillStyle=COL.doorIn;rr(dx+6,by+4,18,36,3);ctx.fill();
 ctx.fillStyle='#ffd08a';ctx.beginPath();ctx.arc(dx+19,by+(hang?18:26),2.5,0,7);ctx.fill();
 // jogador
 if(mode!=='dying'){var p=S.p;if(!(S.invuln>0&&Math.floor(t*20)%2)){ctx.fillStyle=COL.pl;rr(p.x,p.y,22,22,6);ctx.fill();
  var ey=p.g>0?p.y+6:p.y+10,ex=p.x+11+p.face*3;ctx.fillStyle='#fff';ctx.fillRect(ex-8,ey,6,7);ctx.fillRect(ex+2,ey,6,7);
  ctx.fillStyle='#14162e';ctx.fillRect(ex-6+p.face*1.5,ey+(p.g>0?2:3),3,3);ctx.fillRect(ex+4+p.face*1.5,ey+(p.g>0?2:3),3,3)}}
 parts.forEach(function(q){ctx.globalAlpha=Math.max(0,q.l*2);ctx.fillStyle=q.c;ctx.fillRect(q.x-3,q.y-3,6,6)});ctx.globalAlpha=1}

/* ---------- loop (passo fixo) ---------- */
var bannerOn=false;
function frame(now){requestAnimationFrame(frame);var dt=last?Math.min(0.1,Math.max(0,(now-last)/1000)):0;last=now;
 if(!paused&&S){
  if(mode==='play'){acc+=dt;while(acc>=PHYS.STEP){step(S,input,PHYS.STEP);acc-=PHYS.STEP;if(S.ev.length)handle();if(mode!=='play'){acc=0;break}}}
  else if(mode==='dying'){dieT-=dt;if(dieT<=0)respawn()}
  else if(mode==='winning'){winT-=dt;if(winT<=0)completed()}
  if(dAnim<1)dAnim=Math.min(1,dAnim+dt/0.35);
  for(var i=parts.length-1;i>=0;i--){var q=parts[i];q.l-=dt;q.vy+=900*dt;q.x+=q.vx*dt;q.y+=q.vy*dt;if(q.l<=0)parts.splice(i,1)}
  var b=mode==='play'&&S.reverseT>0;if(b!==bannerOn){bannerOn=b;$('banner').classList.toggle('show',b)}}
 draw(now)}
requestAnimationFrame(frame);
})();
</script>
