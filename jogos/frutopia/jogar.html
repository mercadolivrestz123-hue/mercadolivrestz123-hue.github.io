          <div><span class="lab">Recorde</span><span id="oBest">0</span></div>

    <script>
      (function () {
        "use strict";
        var CV = document.getElementById("c"), ctx = CV.getContext("2d");
        var $ = function (id) { return document.getElementById(id); };
        var STAGES = [
          { n: "Acerola", c: "#e03a2a", c2: "#ff7f63", r: 15, leaf: 1 },
          { n: "Jabuticaba", c: "#3a1d4d", c2: "#7b5592", r: 20, leaf: 0 },
          { n: "Morango", c: "#e13b4e", c2: "#ff8292", r: 26, leaf: 1 },
          { n: "Limão", c: "#74ba34", c2: "#b9ea68", r: 33, leaf: 1 },
          { n: "Maracujá", c: "#e0a01c", c2: "#ffd673", r: 41, leaf: 0 },
          { n: "Laranja", c: "#ef7a12", c2: "#ffb75c", r: 49, leaf: 1 },
          { n: "Manga", c: "#e35620", c2: "#ffb62e", r: 58, leaf: 1 },
          { n: "Coco", c: "#7c4b2c", c2: "#c69066", r: 68, leaf: 0 },
          { n: "Abacaxi", c: "#d7a114", c2: "#ffe184", r: 79, leaf: 1 },
          { n: "Mamão", c: "#e2762a", c2: "#ffc971", r: 91, leaf: 1 },
          { n: "Melancia", c: "#2e7d33", c2: "#74c56d", r: 104, leaf: 1 }
        ];
        var DROPPABLE = 5, W = 0, H = 0, DPR = 1, S = 1;
        var jar = { l: 0, r: 0, t: 0, b: 0 }, dangerY = 0, dropY = 0;
        var bodies = [], parts = [], state = "start";
        var score = 0, best = 0, maxStage = 0, nextStage = 0, curStage = 0;
        var dropX = 0, cooldown = 0, overTime = 0, usedAd = false, shake = 0, muted = false, seq = 1;
        var GRAV = 2400, ITER = 7;

        /* ---------- armazenamento ---------- */
        function loadBest() { try { best = parseInt(localStorage.getItem("frutopia.best") || "0", 10) || 0; } catch (e) { best = 0; }
          try { muted = localStorage.getItem("frutopia.mute") === "1"; } catch (e) {} }
        function saveBest() { try { localStorage.setItem("frutopia.best", String(best)); } catch (e) {} }
        function saveMute() { try { localStorage.setItem("frutopia.mute", muted ? "1" : "0"); } catch (e) {} }

        /* ---------- áudio ---------- */
        var AC = null;
        function audio() { if (muted) return null; try { if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)(); if (AC.state === "suspended") AC.resume(); return AC; } catch (e) { return null; } }
        function pop(stage) {
          var a = audio(); if (!a) return;
          var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
          o.type = "sine"; o.frequency.setValueAtTime(620 - stage * 34, t);
          o.frequency.exponentialRampToValueAtTime(Math.max(90, 300 - stage * 18), t + 0.18);
          g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.22, t + 0.012);
          g.gain.exponentialRampToValueAtTime(0.0001, t + 0.26);
          o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.28);
        }
        function thud() {
          var a = audio(); if (!a) return;
          var t = a.currentTime, o = a.createOscillator(), g = a.createGain();
          o.type = "triangle"; o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(70, t + 0.1);
          g.gain.setValueAtTime(0.09, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
          o.connect(g); g.connect(a.destination); o.start(t); o.stop(t + 0.16);
        }

        /* ---------- layout ---------- */
        function resize() {
          DPR = Math.min(window.devicePixelRatio || 1, 2.5);
          W = window.innerWidth; H = window.innerHeight;
          CV.width = Math.round(W * DPR); CV.height = Math.round(H * DPR);
          CV.style.width = W + "px"; CV.style.height = H + "px";
          ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
          var jw = Math.min(W * 0.92, H * 0.5, 470);
          S = jw / 440;
          var jh = Math.min(H * 0.6, 660);
          jar.b = H - Math.max(58, H * 0.09); jar.t = jar.b - jh;
          if (jar.t < 150) { jar.t = 150; jar.b = Math.max(jar.t + 240, jar.b); }
          jar.l = (W - jw) / 2; jar.r = jar.l + jw;
          dangerY = jar.t + 46 * S; dropY = jar.t - 44 * S;
          if (dropY < 128) dropY = 128;
          dropX = Math.min(Math.max(dropX || W / 2, jar.l + 40), jar.r - 40);
        }
        window.addEventListener("resize", resize);
        loadBest(); resize();

        /* ---------- física (Verlet, passo fixo) ---------- */
        var STEP = 1 / 120;
        function rnd() { var r = Math.random(); return r < 0.32 ? 0 : r < 0.6 ? 1 : r < 0.8 ? 2 : r < 0.93 ? 3 : 4; }
        function addBody(x, y, s, vx, vy) {
          var r = STAGES[s].r * S, b = { id: seq++, x: x, y: y, ox: x - (vx || 0) * STEP, oy: y - (vy || 0) * STEP, r: r, m: r * r, s: s, sq: 0, a: 0, age: 0, dead: false };
          bodies.push(b); if (s > maxStage) maxStage = s; return b;
        }
        function step() {
          var i, j, a, b, n = bodies.length, g = GRAV * S * STEP * STEP;
          for (i = 0; i < n; i++) {
            a = bodies[i];
            var vx = (a.x - a.ox) * 0.993, vy = (a.y - a.oy) * 0.993, lim = 26 * S;
            var sp = Math.hypot(vx, vy); if (sp > lim) { vx *= lim / sp; vy *= lim / sp; }
            a.ox = a.x; a.oy = a.y; a.x += vx; a.y += vy + g;
            a.a += vx / a.r; a.age += STEP; a.sq *= 0.9;
          }
          for (var it = 0; it < ITER; it++) {
            for (i = 0; i < n; i++) {
              a = bodies[i];
              for (j = i + 1; j < n; j++) {
                b = bodies[j];
                var dx = b.x - a.x, dy = b.y - a.y, rr = a.r + b.r, d2 = dx * dx + dy * dy;
                if (d2 < rr * rr) {
                  var d = Math.sqrt(d2) || 0.01, ov = (rr - d) * 0.8, nx = dx / d, ny = dy / d, ka = b.m / (a.m + b.m);
                  a.x -= nx * ov * ka; a.y -= ny * ov * ka; b.x += nx * ov * (1 - ka); b.y += ny * ov * (1 - ka);
                }
              }
              if (a.x - a.r < jar.l) a.x = jar.l + a.r;
              if (a.x + a.r > jar.r) a.x = jar.r - a.r;
              if (a.y + a.r > jar.b) { a.y = jar.b - a.r; a.ox = a.x - (a.x - a.ox) * 0.85; }
            }
          }
          // fusões
          var born = [];
          for (i = 0; i < n; i++) {
            a = bodies[i]; if (a.dead) continue;
            for (j = i + 1; j < n; j++) {
              b = bodies[j]; if (b.dead || b.s !== a.s) continue;
              var ddx = b.x - a.x, ddy = b.y - a.y, rs = a.r + b.r + 1.5 * S;
              if (ddx * ddx + ddy * ddy < rs * rs) { a.dead = b.dead = true; born.push([a, b]); break; }
            }
          }
          if (born.length) {
            bodies = bodies.filter(function (q) { return !q.dead; });
            born.forEach(function (p) { merge(p[0], p[1]); });
          }
        }
        function merge(a, b) {
          var s = a.s, mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
          var vx = ((a.x - a.ox) + (b.x - b.ox)) / 2 / STEP, vy = ((a.y - a.oy) + (b.y - b.oy)) / 2 / STEP;
          pop(s);
          if (s === STAGES.length - 1) {
            addScore(1000, mx, my); burst(mx, my, s, 60); shake = 18; return;
          }
          var nb = addBody(mx, my, s + 1, vx * 0.5, vy * 0.5);
          nb.sq = 0.28;
          addScore((s + 1) * (s + 2), mx, my);
          burst(mx, my, s + 1, 10 + s * 3);
          if (s + 1 >= 6) shake = Math.max(shake, 3 + (s + 1) * 1.3);
        }
        function addScore(p, x, y) {
          score += p; $("hScore").textContent = score;
          if (score > best) { $("hBest").textContent = score; }
          parts.push({ t: "+" + p, x: x, y: y, vx: 0, vy: -60, life: 0.9, max: 0.9 });
        }
        function burst(x, y, s, n) {
          var st = STAGES[s];
          for (var i = 0; i < n; i++) {
            var an = Math.random() * Math.PI * 2, sp = (80 + Math.random() * 260) * S;
            parts.push({ x: x, y: y, vx: Math.cos(an) * sp, vy: Math.sin(an) * sp - 80 * S, life: 0.5 + Math.random() * 0.4, max: 0.9, c: i % 2 ? st.c : st.c2, r: (2 + Math.random() * 4) * S });
          }
        }

        /* ---------- desenho ---------- */
        function drawFruit(x, y, s, sq, rot, alpha, rr) {
          var st = STAGES[s], r = rr || st.r * S;
          ctx.save(); ctx.globalAlpha = alpha == null ? 1 : alpha;
          ctx.translate(x, y); ctx.scale(1 + sq, 1 - sq * 0.8);
          ctx.save(); ctx.rotate(Math.sin(rot) * 0.25);
          if (st.leaf) {
            ctx.fillStyle = "#3f9b3a";
            var leaves = s === 8 ? [-0.5, 0, 0.5] : [0.5];
            leaves.forEach(function (k) {
              ctx.save(); ctx.translate(0, -r * 0.92); ctx.rotate(k);
              ctx.beginPath(); ctx.ellipse(r * 0.12, -r * 0.18, r * 0.12 + 1, r * 0.3 + 2, 0.5, 0, Math.PI * 2); ctx.fill(); ctx.restore();
            });
          }
          var gr = ctx.createRadialGradient(-r * 0.35, -r * 0.4, r * 0.1, 0, 0, r);
          gr.addColorStop(0, st.c2); gr.addColorStop(1, st.c);
          ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(0, 0, r, 0, Math.PI * 2); ctx.fill();
          ctx.save(); ctx.clip();
          if (s === 10) { ctx.strokeStyle = "rgba(20,70,25,.55)"; ctx.lineWidth = r * 0.12;
            for (var k = -2; k <= 2; k++) { ctx.beginPath(); ctx.ellipse(k * r * 0.42, 0, r * 0.12, r * 1.1, 0, 0, Math.PI * 2); ctx.stroke(); } }
          if (s === 8) { ctx.strokeStyle = "rgba(140,90,10,.35)"; ctx.lineWidth = 1.5;
            for (var m = -3; m <= 3; m++) { ctx.beginPath(); ctx.moveTo(m * r * 0.35 - r, -r); ctx.lineTo(m * r * 0.35 + r, r); ctx.moveTo(m * r * 0.35 + r, -r); ctx.lineTo(m * r * 0.35 - r, r); ctx.stroke(); } }
          if (s === 2) { ctx.fillStyle = "rgba(255,240,180,.8)";
            for (var q = 0; q < 9; q++) { ctx.beginPath(); ctx.arc(Math.cos(q * 2.4) * r * 0.6, Math.sin(q * 2.4) * r * 0.6 + r * 0.1, Math.max(1, r * 0.04), 0, 7); ctx.fill(); } }
          ctx.fillStyle = "rgba(0,0,0,.14)"; ctx.beginPath(); ctx.arc(r * 0.2, r * 0.25, r * 0.95, 0, Math.PI * 2); ctx.arc(0, 0, r, 0, Math.PI * 2, true); ctx.fill();
          ctx.restore();
          ctx.fillStyle = "rgba(255,255,255,.55)"; ctx.beginPath(); ctx.ellipse(-r * 0.4, -r * 0.45, r * 0.22, r * 0.12, -0.7, 0, Math.PI * 2); ctx.fill();
          ctx.restore();
          // rosto
          var e = Math.max(1.4, r * 0.085), dark = s === 1 || s === 7;
          ctx.fillStyle = dark ? "#fff6ec" : "#2c1636";
          ctx.beginPath(); ctx.arc(-r * 0.28, -r * 0.02, e, 0, 7); ctx.arc(r * 0.28, -r * 0.02, e, 0, 7); ctx.fill();
          ctx.strokeStyle = ctx.fillStyle; ctx.lineWidth = Math.max(1.2, r * 0.06); ctx.lineCap = "round";
          ctx.beginPath(); ctx.arc(0, r * 0.12, r * 0.16, 0.2, Math.PI - 0.2); ctx.stroke();
          ctx.fillStyle = "rgba(255,110,130,.4)";
          ctx.beginPath(); ctx.arc(-r * 0.46, r * 0.16, r * 0.1, 0, 7); ctx.arc(r * 0.46, r * 0.16, r * 0.1, 0, 7); ctx.fill();
          ctx.restore();
        }
        function rrect(x, y, w, h, r) { ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x, y + h - r); ctx.quadraticCurveTo(x, y + h, x + r, y + h); ctx.lineTo(x + w - r, y + h); ctx.quadraticCurveTo(x + w, y + h, x + w, y + h - r); ctx.lineTo(x + w, y); }
        var T = 0;
        function draw() {
          var bg = ctx.createLinearGradient(0, 0, 0, H);
          bg.addColorStop(0, "#40205a"); bg.addColorStop(0.45, "#c4486a"); bg.addColorStop(0.75, "#ff8e4a"); bg.addColorStop(1, "#ffd27a");
          ctx.fillStyle = bg; ctx.fillRect(0, 0, W, H);
          var sun = ctx.createRadialGradient(W / 2, H * 0.62, 10, W / 2, H * 0.62, Math.max(W, H) * 0.45);
          sun.addColorStop(0, "rgba(255,236,170,.55)"); sun.addColorStop(1, "rgba(255,236,170,0)");
          ctx.fillStyle = sun; ctx.fillRect(0, 0, W, H);
          ctx.save();
          if (shake > 0.2) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
          var jl = jar.l - 8 * S, jw = jar.r - jar.l + 16 * S;
          // pote de vidro
          rrect(jl, jar.t - 10 * S, jw, jar.b - jar.t + 18 * S, 34 * S);
          ctx.fillStyle = "rgba(255,246,236,.12)"; ctx.fill();
          ctx.lineWidth = 8 * S; ctx.strokeStyle = "rgba(255,246,236,.55)"; ctx.lineJoin = "round"; ctx.stroke();
          ctx.fillStyle = "rgba(255,246,236,.6)"; ctx.fillRect(jl - 10 * S, jar.t - 14 * S, 20 * S, 8 * S); ctx.fillRect(jl + jw - 10 * S, jar.t - 14 * S, 20 * S, 8 * S);
          // linha de perigo
          var flash = overTime > 0 && Math.floor(T * 8) % 2 === 0;
          ctx.setLineDash([10 * S, 8 * S]); ctx.lineWidth = 3;
          ctx.strokeStyle = overTime > 0 ? (flash ? "#ff2d3c" : "rgba(255,45,60,.4)") : "rgba(255,120,110,.7)";
          ctx.beginPath(); ctx.moveTo(jar.l, dangerY); ctx.lineTo(jar.r, dangerY); ctx.stroke(); ctx.setLineDash([]);
          // guia + fruta atual
          if (state === "play") {
            var cr = STAGES[curStage].r * S;
            ctx.strokeStyle = "rgba(255,246,236,.28)"; ctx.setLineDash([3, 7]); ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(dropX, dropY + cr); ctx.lineTo(dropX, jar.b); ctx.stroke(); ctx.setLineDash([]);
            drawFruit(dropX, dropY, curStage, 0, T * 2, cooldown > 0 ? 0.45 : 1);
          }
          for (var i = 0; i < bodies.length; i++) { var b = bodies[i]; drawFruit(b.x, b.y, b.s, b.sq, b.a, 1); }
          // reflexo do vidro
          var gl = ctx.createLinearGradient(jl, 0, jl + jw, 0);
          gl.addColorStop(0, "rgba(255,255,255,.22)"); gl.addColorStop(0.12, "rgba(255,255,255,0)"); gl.addColorStop(0.85, "rgba(255,255,255,0)"); gl.addColorStop(0.93, "rgba(255,255,255,.14)"); gl.addColorStop(1, "rgba(255,255,255,0)");
          ctx.fillStyle = gl; ctx.fillRect(jl, jar.t, jw, jar.b - jar.t);
          // partículas
          for (i = 0; i < parts.length; i++) {
            var p = parts[i], al = Math.max(0, p.life / p.max);
            ctx.globalAlpha = al;
            if (p.t) { ctx.fillStyle = "#fff6ec"; ctx.font = "600 " + Math.round(18 * Math.max(S, 0.8)) + "px Geist, sans-serif"; ctx.textAlign = "center"; ctx.fillText(p.t, p.x, p.y); }
            else { ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill(); }
          }
          ctx.globalAlpha = 1; ctx.restore();
          // faixa de evolução
          var sw = Math.min(W - 24, 520), gap = sw / STAGES.length, sy = (jar.b + 10 * S + H) / 2, x0 = (W - sw) / 2 + gap / 2;
          for (i = 0; i < STAGES.length; i++) {
            var rr = Math.min(gap * 0.46, 6 + i * 1.4);
            drawFruit(x0 + i * gap, sy, i, 0, 0, i <= maxStage || state === "start" ? 1 : 0.35, rr);
          }
        }

        /* ---------- ciclo ---------- */
        var acc = 0, last = performance.now();
        function frame(now) {
          var dt = Math.min(0.1, (now - last) / 1000); last = now; T += dt;
          if (state === "play") {
            acc += dt;
            while (acc >= STEP) { step(); acc -= STEP; }
            cooldown -= dt; if (keys.l) moveDrop(-560 * S * dt); if (keys.r) moveDrop(560 * S * dt);
            var danger = false;
            for (var i = 0; i < bodies.length; i++) { var b = bodies[i]; if (b.age > 1 && b.y - b.r < dangerY) { danger = true; break; } }
            overTime = danger ? overTime + dt : 0;
            if (overTime > 2) gameOver();
          }
          for (var k = parts.length - 1; k >= 0; k--) {
            var p = parts[k]; p.life -= dt; p.x += p.vx * dt; p.y += p.vy * dt; if (!p.t) p.vy += 700 * S * dt;
            if (p.life <= 0) parts.splice(k, 1);
          }
          shake *= 0.88;
          draw(); requestAnimationFrame(frame);
        }

        /* ---------- controle ---------- */
        var keys = { l: false, r: false };
        function moveDrop(dx) { setDrop(dropX + dx); }
        function setDrop(x) { var r = STAGES[curStage].r * S; dropX = Math.min(Math.max(x, jar.l + r), jar.r - r); }
        function drop() {
          if (state !== "play" || cooldown > 0) return;
          setDrop(dropX); addBody(dropX, dropY, curStage, 0, 0); thud();
          curStage = nextStage; nextStage = rnd(); cooldown = 0.55; setDrop(dropX); updNext();
        }
        function updNext() { var st = STAGES[nextStage]; $("hNextName").textContent = st.n; $("hNextOrb").style.background = "radial-gradient(circle at 35% 30%," + st.c2 + "," + st.c + ")"; }
        CV.addEventListener("pointerdown", function (e) { if (state === "play") setDrop(e.clientX); });
        CV.addEventListener("pointermove", function (e) { if (state === "play") setDrop(e.clientX); });
        CV.addEventListener("pointerup", function (e) { if (state === "play") { setDrop(e.clientX); drop(); } });
        window.addEventListener("keydown", function (e) {
          if (e.key === "ArrowLeft" || e.key === "a") keys.l = true;
          else if (e.key === "ArrowRight" || e.key === "d") keys.r = true;
          else if ((e.key === " " || e.key === "ArrowDown" || e.key === "Enter") && state === "play") { e.preventDefault(); drop(); }
          else if ((e.key === "Escape" || e.key === "p") && (state === "play" || state === "pause")) state === "play" ? pause() : resume();
        });
        window.addEventListener("keyup", function (e) { if (e.key === "ArrowLeft" || e.key === "a") keys.l = false; if (e.key === "ArrowRight" || e.key === "d") keys.r = false; });
        document.addEventListener("visibilitychange", function () { if (document.hidden && state === "play") pause(); });

        /* ---------- telas ---------- */
        function show(id) { ["sStart", "sPause", "sOver"].forEach(function (s) { $(s).hidden = s !== id; }); $("hud").hidden = id === "sStart"; }
        function start() {
          bodies = []; parts = []; score = 0; maxStage = 0; overTime = 0; usedAd = false; cooldown = 0.3; acc = 0;
          curStage = rnd(); nextStage = rnd(); dropX = W / 2; setDrop(dropX); updNext();
          $("hScore").textContent = "0"; $("hBest").textContent = best; state = "play"; show(null); audio();
        }
        function pause() { state = "pause"; show("sPause"); }
        function resume() { state = "play"; last = performance.now(); show(null); }
        function gameOver() {
          state = "over"; overTime = 0;
          var rec = score > best && score > 0; if (rec) { best = score; saveBest(); }
          $("oScore").textContent = score; $("oBest").textContent = best; $("oFruit").textContent = STAGES[maxStage].n;
          $("oRec").hidden = !rec; $("bContinue").hidden = usedAd || bodies.length === 0; $("sBest").textContent = best; show("sOver");
        }
        function continueRun() {
          usedAd = true;
          bodies.slice().sort(function (a, b) { return a.s - b.s || a.r - b.r; }).slice(0, 5).forEach(function (b) { b.dead = true; burst(b.x, b.y, b.s, 8); });
          bodies = bodies.filter(function (b) { return !b.dead; });
          bodies.forEach(function (b) { b.age = -2; });
          overTime = 0; cooldown = 0.4; state = "play"; last = performance.now(); show(null); pop(3);
        }

        /* ---------- anúncios (Ad Placement API) ---------- */
        function noAds() { return Array.isArray(window.adsbygoogle) && window.adsbygoogle.push === Array.prototype.push; }
        function cfgAds() { try { adConfig({ preloadAdBreaks: "on", sound: muted ? "off" : "on" }); } catch (e) {} }
        cfgAds();
        function adNext(done) {
          if (noAds()) return done();
          var prev = muted;
          adBreak({ type: "next", name: "restart-game",
            beforeAd: function () { muted = true; if (AC) AC.suspend(); },
            afterAd: function () { muted = prev; if (AC && !muted) AC.resume(); },
            adBreakDone: function () { done(); } });
        }
        function adReward() {
          if (noAds()) return continueRun();
          var granted = false;
          adBreak({ type: "reward", name: "continue-run",
            beforeAd: function () { if (AC) AC.suspend(); },
            afterAd: function () { if (AC && !muted) AC.resume(); },
            beforeReward: function (showAdFn) { showAdFn(); },
            adDismissed: function () {},
            adViewed: function () { granted = true; },
            adBreakDone: function () { if (granted) continueRun(); } });
        }

        function soundLabel() { $("bSound").textContent = muted ? "🔇 Som desligado" : "🔊 Som ligado"; }
        $("bPlay").addEventListener("click", start);
        $("bSound").addEventListener("click", function () { muted = !muted; saveMute(); soundLabel(); cfgAds(); if (!muted) pop(2); });
        $("bPause").addEventListener("click", function () { if (state === "play") pause(); });
        $("bResume").addEventListener("click", resume);
        $("bQuit").addEventListener("click", function () { if (score > best) { best = score; saveBest(); } $("sBest").textContent = best; bodies = []; state = "start"; show("sStart"); });
        $("bAgain").addEventListener("click", function () { adNext(start); });
        $("bContinue").addEventListener("click", adReward);

        $("sBest").textContent = best; soundLabel(); show("sStart");
        requestAnimationFrame(frame);
      })();
    </script>
  </body>
</html>
