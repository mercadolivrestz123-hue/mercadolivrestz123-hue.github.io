    <style>
      :root {
        --ink: #f3eaff;
        --ink-2: #b9a9dd;
        --pink: #ff5fa8;
        --mint: #46e3c0;
        --gold: #ffd24a;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        -webkit-tap-highlight-color: transparent;
      }
      html,
      body {
        height: 100%;
        overflow: hidden;
        background: #0c0828;
      }
      body {
        font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
        color: var(--ink);
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      #wrap {
        position: fixed;
        inset: 0;
        touch-action: none;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
        touch-action: none;
      }
      .layer {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        text-align: center;
        background: radial-gradient(120% 90% at 50% 10%, rgba(70, 40, 140, 0.72), rgba(8, 5, 26, 0.9));
        backdrop-filter: blur(6px);
        -webkit-backdrop-filter: blur(6px);
      }
      .layer[hidden] {
        display: none;
      }
      h1 {
        font-size: clamp(44px, 16vw, 96px);
        letter-spacing: 0.12em;
        font-weight: 800;
        background: linear-gradient(180deg, #fff, #ffb3e0 45%, #7be8ff);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        filter: drop-shadow(0 6px 18px rgba(255, 95, 168, 0.45));
      }
      h2 {
        font-size: clamp(24px, 7vw, 38px);
        letter-spacing: 0.06em;
        font-weight: 800;
      }
      p.sub {
        max-width: 22em;
        font-size: clamp(15px, 4.2vw, 19px);
        line-height: 1.45;
        color: var(--ink-2);
      }
      .btn {
        appearance: none;
        border: 0;
        cursor: pointer;
        font: inherit;
        font-weight: 800;
        letter-spacing: 0.07em;
        color: #2a0b33;
        min-height: 56px;
        min-width: 240px;
        padding: 14px 26px;
        border-radius: 999px;
        background: linear-gradient(180deg, #ffe9f6, #ff7ec0 55%, #e8469b);
        box-shadow: 0 8px 0 #9c2466, 0 14px 26px rgba(0, 0, 0, 0.38);
        transition: transform 0.12s ease, box-shadow 0.12s ease;
      }
      .btn:active {
        transform: translateY(5px);
        box-shadow: 0 3px 0 #9c2466, 0 8px 16px rgba(0, 0, 0, 0.35);
      }
      .btn--ghost {
        color: var(--ink);
        background: rgba(255, 255, 255, 0.08);
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: none;
        min-height: 50px;
        font-size: 15px;
      }
      .btn--ghost:active {
        transform: translateY(2px);
        box-shadow: none;
      }
      .btn--ad {
        color: #06221c;
        background: linear-gradient(180deg, #d8fff5, #4fe6c3 55%, #16b894);
        box-shadow: 0 8px 0 #0b7a63, 0 14px 26px rgba(0, 0, 0, 0.38);
        font-size: 15px;
      }
      .stars {
        display: flex;
        gap: 10px;
        font-size: clamp(38px, 12vw, 64px);
        line-height: 1;
      }
      .star {
        color: rgba(255, 255, 255, 0.16);
        text-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
        transform: scale(0.6);
        transition: transform 0.35s cubic-bezier(0.2, 1.6, 0.4, 1), color 0.35s ease;
      }
      .star.on {
        color: var(--gold);
        transform: scale(1);
        text-shadow: 0 0 22px rgba(255, 210, 74, 0.7);
      }
      .foot {
        position: absolute;
        bottom: 14px;
        font-size: 11px;
        letter-spacing: 0.08em;
        color: rgba(185, 169, 221, 0.75);
      }
      #hud {
        position: absolute;
        inset: 0 0 auto 0;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: calc(10px + env(safe-area-inset-top)) 12px 10px;
        pointer-events: none;
      }
      .tag {
        pointer-events: none;
        background: rgba(12, 8, 40, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.06em;
        white-space: nowrap;
      }
      .tag b {
        color: var(--mint);
      }
      #pause {
        pointer-events: auto;
        margin-left: auto;
        width: 44px;
        height: 44px;
        min-width: 44px;
        border-radius: 999px;
        display: grid;
        place-items: center;
        font-size: 15px;
        padding: 0;
        background: rgba(12, 8, 40, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.16);
        color: var(--ink);
        box-shadow: none;
      }
      #hint {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(26px + env(safe-area-inset-bottom));
        text-align: center;
        font-size: 14px;
        letter-spacing: 0.08em;
        color: rgba(243, 234, 255, 0.78);
        pointer-events: none;
        transition: opacity 0.35s ease;
      }
      .row {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .big {
        font-size: clamp(30px, 10vw, 46px);
        font-weight: 800;
        color: var(--gold);
      }
    </style>
  </head>
  <body>
    <div id="wrap">
      <canvas id="game"></canvas>

      <div id="hud" hidden>
        <span class="tag" id="tFase">Fase 1</span>
        <span class="tag" id="tProg">Estouradas <b>0/5</b></span>
        <span class="tag" id="tPts">0 pts</span>
        <button class="btn" id="pause" aria-label="Pausar">❚❚</button>
      </div>
      <div id="hint" hidden>Toque para começar a reação</div>

      <section class="layer" id="scStart">
        <h1>BOLHAS</h1>
        <p class="sub">Um toque por fase. Faça a maior reação em cadeia!</p>
        <button class="btn" id="bPlay">JOGAR</button>
        <button class="btn btn--ghost" id="bSound">SOM: LIGADO</button>
        <p class="foot">© 2026 Órbita Jogos</p>
      </section>

      <section class="layer" id="scPause" hidden>
        <h2>PAUSADO</h2>
        <button class="btn" id="bResume">CONTINUAR</button>
        <button class="btn btn--ghost" id="bSound2">SOM: LIGADO</button>
        <button class="btn btn--ghost" id="bMenu">MENU INICIAL</button>
      </section>

      <section class="layer" id="scWin" hidden>
        <h2>FASE CONCLUÍDA</h2>
        <div class="stars" id="starBox">
          <span class="star">★</span><span class="star">★</span><span class="star">★</span>
        </div>
        <div class="row">
          <p class="sub" id="winTxt">Você estourou 12 bolhas em cadeia.</p>
          <p class="big" id="winPts">0 pts</p>
        </div>
        <button class="btn" id="bNext">PRÓXIMA FASE</button>
      </section>

      <section class="layer" id="scFail" hidden>
        <h2>QUASE!</h2>
        <p class="sub" id="failTxt">Faltaram 3 bolhas para concluir a fase.</p>
        <button class="btn" id="bRetry">TENTAR DE NOVO</button>
        <button class="btn btn--ad" id="bExtra">+1 TOQUE (assistir anúncio)</button>
      </section>
    </div>

    <script>
      (function () {
        "use strict";

        /* ---------- armazenamento com fallback em memória ---------- */
        var mem = {};
        function load(k, d) {
          try {
            var v = window.localStorage.getItem(k);
            return v === null ? (k in mem ? mem[k] : d) : JSON.parse(v);
          } catch (e) {
            return k in mem ? mem[k] : d;
          }
        }
        function save(k, v) {
          mem[k] = v;
          try {
            window.localStorage.setItem(k, JSON.stringify(v));
          } catch (e) {}
        }

        var state = {
          level: load("bolhas.level", 1),
          score: load("bolhas.score", 0),
          sound: load("bolhas.sound", true)
        };

        /* ---------- metas das fases ---------- */
        var GOALS = [
          [5, 10], [8, 15], [12, 20], [16, 25], [20, 30], [25, 35],
          [30, 40], [35, 45], [40, 50], [45, 55], [52, 62], [60, 70]
        ];
        function levelCfg(n) {
          if (n <= GOALS.length) return { goal: GOALS[n - 1][0], count: GOALS[n - 1][1] };
          var extra = n - GOALS.length;
          var count = 70 + extra * 8;
          return { goal: Math.min(count - 6, 60 + extra * 7), count: count };
        }

        /* ---------- áudio ---------- */
        var actx = null;
        function ac() {
          if (!actx) {
            var C = window.AudioContext || window.webkitAudioContext;
            if (!C) return null;
            try {
              actx = new C();
            } catch (e) {
              return null;
            }
          }
          if (actx.state === "suspended") {
            try { actx.resume(); } catch (e) {}
          }
          return actx;
        }
        function tone(freq, dur, type, vol, slide) {
          if (!state.sound) return;
          var c = ac();
          if (!c) return;
          try {
            var o = c.createOscillator(), g = c.createGain(), t = c.currentTime;
            o.type = type || "sine";
            o.frequency.setValueAtTime(freq, t);
            if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(40, freq * slide), t + dur);
            g.gain.setValueAtTime(0.0001, t);
            g.gain.exponentialRampToValueAtTime(vol || 0.18, t + 0.012);
            g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
            o.connect(g);
            g.connect(c.destination);
            o.start(t);
            o.stop(t + dur + 0.03);
          } catch (e) {}
        }
        function popSound(depth) {
          var f = 240 * Math.pow(1.06, Math.min(depth, 26));
          tone(f, 0.16, "triangle", 0.16, 1.9);
        }
        function winSound() {
          [523, 659, 784, 1047].forEach(function (f, i) {
            setTimeout(function () { tone(f, 0.26, "sine", 0.16); }, i * 95);
          });
        }
        function failSound() {
          tone(300, 0.45, "sawtooth", 0.12, 0.45);
        }

        /* ---------- canvas ---------- */
        var cv = document.getElementById("game"), ctx = cv.getContext("2d");
        var W = 0, H = 0, dpr = 1;
        function resize() {
          dpr = Math.min(window.devicePixelRatio || 1, 2.5);
          W = window.innerWidth;
          H = window.innerHeight;
          cv.width = Math.round(W * dpr);
          cv.height = Math.round(H * dpr);
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        window.addEventListener("resize", resize);
        resize();

        var COLORS = [
          ["#ff7ec0", "#e8469b"], ["#7be8ff", "#2aa8d8"], ["#ffd24a", "#e8a21c"],
          ["#9d8bff", "#6446e0"], ["#5ff0b8", "#1fb98a"], ["#ff9d6e", "#e45f3a"]
        ];

        /* ---------- objetos do jogo ---------- */
        var bubbles = [], rings = [], parts = [], floats = [];
        var running = false, taps = 0, popped = 0, chainMax = 0, levelScore = 0, extraUsed = false;
        var cfg = levelCfg(state.level);
        var settleTimer = 0;

        function rnd(a, b) { return a + Math.random() * (b - a); }

        function buildLevel() {
          cfg = levelCfg(state.level);
          bubbles.length = 0; rings.length = 0; parts.length = 0; floats.length = 0;
          popped = 0; chainMax = 0; levelScore = 0; taps = 1; settleTimer = 0;
          var base = Math.max(12, Math.min(W, H) * 0.045);
          var sp = 20 + Math.min(state.level, 12) * 2.4;
          for (var i = 0; i < cfg.count; i++) {
            var r = rnd(base * 0.78, base * 1.25);
            var a = rnd(0, Math.PI * 2);
            bubbles.push({
              x: rnd(r + 6, W - r - 6),
              y: rnd(r + 80, H - r - 50),
              vx: Math.cos(a) * sp,
              vy: Math.sin(a) * sp,
              r: r,
              c: COLORS[(Math.random() * COLORS.length) | 0],
              ph: rnd(0, 6.28),
              dead: false
            });
          }
          updHud();
        }

        function addRing(x, y, depth) {
          rings.push({ x: x, y: y, t: 0, life: 1.2, max: Math.max(W, H) * 0.14 + 52, depth: depth });
        }

        function popBubble(b, depth) {
          b.dead = true;
          popped++;
          chainMax = Math.max(chainMax, depth);
          var pts = 10 + depth * 5;
          levelScore += pts;
          state.score += pts;
          floats.push({ x: b.x, y: b.y, t: 0, txt: "+" + pts, c: b.c[0] });
          addRing(b.x, b.y, depth);
          popSound(depth);
          for (var i = 0; i < 9; i++) {
            var a = rnd(0, 6.283), s = rnd(40, 200);
            parts.push({ x: b.x, y: b.y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: rnd(0.4, 0.8), r: rnd(1.5, 3.6), c: b.c[0] });
          }
          updHud();
        }

        /* ---------- laço principal ---------- */
        var last = 0;
        function frame(now) {
          var dt = Math.min(0.05, (now - last) / 1000 || 0);
          last = now;
          if (running) update(dt);
          draw();
          requestAnimationFrame(frame);
        }

        function update(dt) {
          var i, b;
          for (i = 0; i < bubbles.length; i++) {
            b = bubbles[i];
            if (b.dead) continue;
            b.x += b.vx * dt;
            b.y += b.vy * dt;
            b.ph += dt * 2;
            if (b.x < b.r) { b.x = b.r; b.vx = Math.abs(b.vx); }
            if (b.x > W - b.r) { b.x = W - b.r; b.vx = -Math.abs(b.vx); }
            if (b.y < b.r + 56) { b.y = b.r + 56; b.vy = Math.abs(b.vy); }
            if (b.y > H - b.r) { b.y = H - b.r; b.vy = -Math.abs(b.vy); }
          }
          for (i = rings.length - 1; i >= 0; i--) {
            var g = rings[i];
            g.t += dt;
            var rad = g.max * Math.min(1, g.t / g.life);
            for (var j = 0; j < bubbles.length; j++) {
              b = bubbles[j];
              if (b.dead) continue;
              var dx = b.x - g.x, dy = b.y - g.y, d = Math.sqrt(dx * dx + dy * dy);
              if (d < rad + b.r) popBubble(b, g.depth + 1);
            }
            if (g.t >= g.life) rings.splice(i, 1);
          }
          for (i = parts.length - 1; i >= 0; i--) {
            var p = parts[i];
            p.t += dt;
            p.x += p.vx * dt;
            p.y += p.vy * dt;
            p.vy += 150 * dt;
            p.vx *= 0.98;
            if (p.t >= p.life) parts.splice(i, 1);
          }
          for (i = floats.length - 1; i >= 0; i--) {
            floats[i].t += dt;
            floats[i].y -= 34 * dt;
            if (floats[i].t > 1) floats.splice(i, 1);
          }
          if (taps === 0 && rings.length === 0) {
            settleTimer += dt;
            if (settleTimer > 0.45) endLevel();
          }
        }

        /* ---------- desenho ---------- */
        function bg() {
          var g = ctx.createLinearGradient(0, 0, W * 0.4, H);
          g.addColorStop(0, "#241060");
          g.addColorStop(0.55, "#160c3f");
          g.addColorStop(1, "#090521");
          ctx.fillStyle = g;
          ctx.fillRect(0, 0, W, H);
          var rg = ctx.createRadialGradient(W * 0.5, H * 0.18, 10, W * 0.5, H * 0.18, Math.max(W, H) * 0.7);
          rg.addColorStop(0, "rgba(120,70,220,0.30)");
          rg.addColorStop(1, "rgba(0,0,0,0)");
          ctx.fillStyle = rg;
          ctx.fillRect(0, 0, W, H);
        }

        function draw() {
          bg();
          var i;
          for (i = 0; i < rings.length; i++) {
            var g = rings[i], k = Math.min(1, g.t / g.life);
            var rad = g.max * k;
            ctx.globalAlpha = Math.max(0, 1 - k) * 0.85;
            ctx.strokeStyle = "rgba(255,255,255,0.9)";
            ctx.lineWidth = 3 + 6 * (1 - k);
            ctx.beginPath();
            ctx.arc(g.x, g.y, rad, 0, 6.283);
            ctx.stroke();
            ctx.globalAlpha = Math.max(0, 1 - k) * 0.22;
            ctx.fillStyle = "#9d8bff";
            ctx.fill();
            ctx.globalAlpha = 1;
          }
          for (i = 0; i < bubbles.length; i++) {
            var b = bubbles[i];
            if (b.dead) continue;
            var wob = 1 + Math.sin(b.ph) * 0.03;
            var r = b.r * wob;
            var gr = ctx.createRadialGradient(b.x - r * 0.33, b.y - r * 0.38, r * 0.12, b.x, b.y, r);
            gr.addColorStop(0, "#ffffff");
            gr.addColorStop(0.28, b.c[0]);
            gr.addColorStop(1, b.c[1]);
            ctx.fillStyle = gr;
            ctx.beginPath();
            ctx.arc(b.x, b.y, r, 0, 6.283);
            ctx.fill();
            ctx.strokeStyle = "rgba(255,255,255,0.35)";
            ctx.lineWidth = 1.2;
            ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,0.75)";
            ctx.beginPath();
            ctx.ellipse(b.x - r * 0.33, b.y - r * 0.4, r * 0.2, r * 0.13, -0.6, 0, 6.283);
            ctx.fill();
          }
          for (i = 0; i < parts.length; i++) {
            var p = parts[i];
            ctx.globalAlpha = Math.max(0, 1 - p.t / p.life);
            ctx.fillStyle = p.c;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.r, 0, 6.283);
            ctx.fill();
          }
          ctx.globalAlpha = 1;
          ctx.textAlign = "center";
          ctx.font = "700 18px 'Trebuchet MS', sans-serif";
          for (i = 0; i < floats.length; i++) {
            var f = floats[i];
            ctx.globalAlpha = Math.max(0, 1 - f.t);
            ctx.fillStyle = f.c;
            ctx.fillText(f.txt, f.x, f.y);
          }
          ctx.globalAlpha = 1;
        }
        requestAnimationFrame(frame);

        /* ---------- telas ---------- */
        var el = function (id) { return document.getElementById(id); };
        var scStart = el("scStart"), scPause = el("scPause"), scWin = el("scWin"), scFail = el("scFail");
        var hud = el("hud"), hint = el("hint");

        function show(sc) {
          [scStart, scPause, scWin, scFail].forEach(function (s) { s.hidden = s !== sc; });
        }
        function hideAll() { show(null); }

        function updHud() {
          el("tFase").textContent = "Fase " + state.level;
          el("tProg").innerHTML = "Estouradas <b>" + popped + "/" + cfg.goal + "</b>";
          el("tPts").textContent = state.score + " pts";
        }
        function soundLabel() {
          var t = "SOM: " + (state.sound ? "LIGADO" : "DESLIGADO");
          el("bSound").textContent = t;
          el("bSound2").textContent = t;
        }
        function toggleSound() {
          state.sound = !state.sound;
          save("bolhas.sound", state.sound);
          soundLabel();
          if (state.sound) tone(660, 0.12, "sine", 0.14);
          try { adConfig({ preloadAdBreaks: "on", sound: state.sound ? "on" : "off" }); } catch (e) {}
        }
        soundLabel();

        function startBtnLabel() {
          el("bPlay").textContent = state.level > 1 ? "CONTINUAR FASE " + state.level : "JOGAR";
        }
        startBtnLabel();

        /* ---------- fluxo ---------- */
        function startLevel() {
          buildLevel();
          hideAll();
          hud.hidden = false;
          hint.hidden = false;
          hint.style.opacity = "1";
          hint.textContent = "Toque para começar a reação";
          running = true;
          last = performance.now();
        }

        function endLevel() {
          running = false;
          hint.hidden = true;
          save("bolhas.score", state.score);
          if (popped >= cfg.goal) {
            var ratio = popped / cfg.count;
            var stars = popped >= cfg.goal ? 1 : 0;
            if (ratio >= 0.8) stars = 3; else if (ratio >= (cfg.goal / cfg.count + 0.8) / 2) stars = 2;
            var box = el("starBox").children;
            for (var i = 0; i < 3; i++) box[i].classList.remove("on");
            el("winTxt").textContent =
              "Você estourou " + popped + " de " + cfg.count + " bolhas, em cadeia de " + chainMax + " níveis.";
            el("winPts").textContent = "+" + levelScore + " pts";
            show(scWin);
            hud.hidden = true;
            winSound();
            for (var s = 0; s < stars; s++) {
              (function (n) { setTimeout(function () { box[n].classList.add("on"); }, 220 + n * 230); })(s);
            }
            state.level += 1;
            save("bolhas.level", state.level);
            startBtnLabel();
          } else {
            el("failTxt").textContent =
              "Faltaram " + (cfg.goal - popped) + " bolhas para concluir a fase. Você estourou " + popped + ".";
            el("bExtra").hidden = extraUsed;
            show(scFail);
            hud.hidden = true;
            failSound();
          }
        }

        /* ---------- anúncios ---------- */
        function isShim() {
          return !!(window.adsbygoogle && Array.isArray(window.adsbygoogle));
        }
        function showAd(name, type, cb) {
          var fired = false, rewarded = false;
          function done(ok) { if (!fired) { fired = true; cb(ok); } }
          var cfgObj = {
            type: type,
            name: name,
            beforeAd: function () { running = false; },
            afterAd: function () {},
            adBreakDone: function () { done(type === "reward" ? rewarded : true); }
          };
          if (type === "reward") {
            cfgObj.beforeReward = function (showAdFn) { showAdFn(); };
            cfgObj.adDismissed = function () { done(false); };
            cfgObj.adViewed = function () { rewarded = true; done(true); };
          }
          if (isShim()) {
            done(true);
            return;
          }
          try {
            adBreak(cfgObj);
          } catch (e) {
            done(true);
          }
        }

        /* ---------- entrada ---------- */
        function tap(x, y) {
          if (!running || taps <= 0) return;
          taps--;
          addRing(x, y, 0);
          tone(520, 0.18, "sine", 0.14, 1.6);
          hint.style.opacity = "0";
          settleTimer = 0;
        }
        cv.addEventListener("pointerdown", function (e) {
          e.preventDefault();
          ac();
          tap(e.clientX, e.clientY);
        });

        el("bPlay").addEventListener("click", function () {
          ac();
          try { adConfig({ preloadAdBreaks: "on", sound: state.sound ? "on" : "off" }); } catch (e) {}
          startLevel();
        });
        el("bSound").addEventListener("click", toggleSound);
        el("bSound2").addEventListener("click", toggleSound);
        el("bNext").addEventListener("click", function () {
          extraUsed = false;
          showAd("next-level", "next", function () { startLevel(); });
        });
        el("bRetry").addEventListener("click", startLevel);
        el("bExtra").addEventListener("click", function () {
          if (extraUsed) return;
          showAd("extra-tap", "reward", function (ok) {
            if (!ok) return;
            extraUsed = true;
            el("bExtra").hidden = true;
            hideAll();
            hud.hidden = false;
            hint.hidden = false;
            hint.style.opacity = "1";
            hint.textContent = "Toque extra: use com sabedoria!";
            taps = 1;
            settleTimer = 0;
            running = true;
            last = performance.now();
          });
        });
        el("bMenu").addEventListener("click", function () {
          running = false;
          hud.hidden = true;
          hint.hidden = true;
          startBtnLabel();
          show(scStart);
        });
        el("pause").addEventListener("click", function () {
          running = false;
          hud.hidden = true;
          show(scPause);
        });
        el("bResume").addEventListener("click", function () {
          if (!bubbles.length) { startLevel(); return; }
          if (!scPause.hidden) {
            hideAll();
            hud.hidden = false;
            hint.hidden = taps === 0;
            running = true;
            last = performance.now();
          }
        });
        function doPause() {
          if (!running) return;
          running = false;
          hud.hidden = true;
          show(scPause);
        }
        document.addEventListener("visibilitychange", function () {
          if (document.hidden) doPause();
        });
        window.addEventListener("blur", doPause);

        show(scStart);
      })();
    </script>
  </body>
</html>
